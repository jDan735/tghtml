[project]
name = "tghtml"
version = "2.0.3"
description = "Simple tool for parse common HTML to Telegram HTML"
authors = [{ name = "Daniel Zakharov", email = "gzdan734@gmail.com" }]
requires-python = ">=3.10,<3.15"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
    "nh3>=0.3.4",
    "pylatexenc>=2.10",
    "selectolax>=0.4.7",
]

[tool.pdm.scripts]
test = {cmd = "python -m unittest tests/tests.py"}

[dependency-groups]
dev = [
    "tghtml",
    "haitch>=0.15.0",
]

[tool.black]
line-length = 80
