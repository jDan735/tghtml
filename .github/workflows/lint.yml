name: Run mypy lint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Install dependencies
      run: pip install ".[dev]"

    - name: Install mypy
      run: pip install mypy

    - name: Type check with mypy
      run: mypy tghtml
