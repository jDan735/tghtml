name: Run mypy lint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ty:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Install dependencies
      run: pip install ".[dev]" mypy

    - name: Type check with ty
      run: mypy tghtml
